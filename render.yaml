services:
  - type: worker
    name: agent-member-telegram-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: agent_member_bot
      - key: OWNER_IDS
        sync: false
      - key: LOG_LEVEL
        value: INFO